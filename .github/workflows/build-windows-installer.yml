# Build an unsigned Windows x64 installer and publish it as a GitHub Release.
#
# The upstream publication workflows are not part of this fork: they need the
# dedicated self-hosted packaging runner, the SafeNet EV token, the machine
# presets, and the publication credentials. This workflow produces the one
# artifact the fork needs, on a GitHub-hosted runner, from a version tag.
#
# The hosted windows-2025 image carries Visual Studio Enterprise 2022 with the
# C++ tools, the Windows SDK, VSWhere, Python, 7zip, and Node, which satisfies
# the repository's own desktop-toolchain-preflight.ts probe.
name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的版本 tag，带 v 前缀；留空则使用本次运行的 ref'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  # One installer per tag. A rerun of the same tag waits for the first run
  # instead of producing a second installer for the same version.
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PRIMARY_NODE_VERSION: '24'
      DSH_TELEMETRY_DISABLED: '1'
      # The unsigned mode needs no certificate and no publication credential.
      PACKAGE_SIGNING: unsigned
      DSH_PACKAGING_PRESET: test
      # The tag names the release, so the version is the tag's own suffix.
      PACKAGE_VERSION_MODE: manual
      DSH_DESKTOP_UPDATE_CHANNEL: nightly
      DSH_FORK_CACHE: 'C:\dsh-fork-cache'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Configure the build caches
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DSH_FORK_CACHE" | Out-Null
          "DSH_DESKTOP_PACKAGE_CACHE_DIR=$env:DSH_FORK_CACHE/package" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$env:DSH_FORK_CACHE/electron-builder" >> $env:GITHUB_ENV
          "DSH_PACKAGING_CONFIG_DIR=$env:DSH_FORK_CACHE/packaging-config" >> $env:GITHUB_ENV
          pnpm config set store-dir "$env:DSH_FORK_CACHE/pnpm"

      - name: Write the unsigned packaging preset
        run: |
          $presetDirectory = Join-Path $env:DSH_PACKAGING_CONFIG_DIR 'presets'
          New-Item -ItemType Directory -Force -Path $presetDirectory | Out-Null
          # The mandatory-update origin and the download origin resolve to a
          # reserved non-resolving host: the packaged application records the
          # policy query as unavailable and never blocks on it.
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.dsh.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{"allowedAuthOrigins":["https://login.dsh.invalid"]}'
          DOWNLOAD_TEST_ORIGIN=https://updates.dsh.invalid
          DOWNLOAD_TEST_RELEASE_ID=6f1c9d4b8a2e7f35c0b19d6e8a47f253
          DSH_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3
          '@ | Set-Content -Path (Join-Path $presetDirectory 'test.env') -Encoding utf8

      - name: Restore the pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.DSH_FORK_CACHE }}/pnpm
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Restore the packaging caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ env.DSH_FORK_CACHE }}/package
            ${{ env.DSH_FORK_CACHE }}/electron-builder
          key: desktop-package-${{ runner.os }}-${{ hashFiles('scripts/primary-runtime/lock.json') }}
          restore-keys: desktop-package-${{ runner.os }}-

      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve the version tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          TRIGGER_TAG: ${{ github.ref_name }}
          PACKAGE_SOURCE_REF: ${{ steps.tag.outputs.release_tag }}
        run: |
          $tag = if ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { $env:TRIGGER_TAG }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+') { throw "The version tag must start with v and a three-part version, got '$tag'" }
          "version=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check the packaging configuration and toolchain
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ steps.tag.outputs.version }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs

      - name: Check the packaging entry point
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: pnpm run package:desktop:win:x64:unsigned -- --check --build-version $env:PACKAGE_VERSION

      - name: Build the installer and verify the packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: pnpm run package:desktop:win:x64:unsigned -- --build-version $env:PACKAGE_VERSION

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = Join-Path $artifacts "deepseek-harness-$env:PACKAGE_VERSION-win-x64-unsigned.exe"
          if (-not (Test-Path $installer)) { throw "The installer is missing at $installer" }
          $assets = @($installer)
          if (Test-Path "$installer.blockmap") { $assets += "$installer.blockmap" }
          $notes = "Unsigned Windows x64 installer for version $env:PACKAGE_VERSION.`n`nBuilt from commit $env:GITHUB_SHA on the hosted windows-2025 runner. The installer carries no signature, so Windows shows an unknown-publisher warning on first launch."
          gh release create $env:RELEASE_TAG @assets --title "DeepSeek Harness $env:PACKAGE_VERSION (Windows x64, unsigned)" --notes $notes --clobber --repo $env:GITHUB_REPOSITORY

      - name: Retain the packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ github.workspace }}/apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
